name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install reader dependencies
        run: pnpm --dir reader install --frozen-lockfile
      - name: Check (lint + format)
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Focused publisher suites
        run: >-
          pnpm test tests/stage-content.test.mjs
          tests/knowledge-reader-contract.test.mjs tests/navigation.test.mjs
          tests/wiki-aliases.test.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Reader integrated suite (retry once)
        shell: bash
        run: |
          for attempt in 1 2; do
            if pnpm test tests/knowledge-reader-integrated.test.mjs; then
              break
            elif [ "$attempt" -eq 2 ]; then
              exit 1
            else
              echo "Integrated suite attempt $attempt failed, retrying..."
            fi
          done
