server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Quartz rollback output (pinned, vendored emitter convention).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Knowledge reader output (Next.js static export hashed assets).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
