server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Quartz rollback output (pinned, vendored emitter convention).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Knowledge reader output (Next.js static export hashed assets).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Offline update checks: the worker and its reader-facing manifest must
    # never serve stale bytes, so an update check always sees the new
    # publication instead of a cached worker.
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache";
    }

    location = /offline.json {
        expires 0;
        add_header Cache-Control "no-cache";
    }
}
