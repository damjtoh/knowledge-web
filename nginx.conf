server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
        # Workbox verifies the exact exported bytes. Cloudflare Email
        # Obfuscation would rewrite HTML with visible addresses otherwise.
        add_header Cache-Control "no-transform";
    }

    # Long-lived immutable caching for hashed static assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Knowledge reader output (Next.js static export hashed assets).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's default MIME map does not include .webmanifest. Without this,
    # browsers download the install manifest as application/octet-stream.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # Offline update checks: the worker and its reader-facing manifest must
    # never serve stale bytes, so an update check always sees the new
    # publication instead of a cached worker.
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache";
    }

    location = /offline.json {
        expires 0;
        add_header Cache-Control "no-cache";
    }
}
