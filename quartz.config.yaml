# Knowledge Web Publisher — shared Quartz v5 configuration.
#
# This is the base configuration every Web Projection builds from. `pageTitle`
# and `baseUrl` are per-Knowledge-Base values injected by
# `scripts/stage-content.mjs` from the Publication Manifest; the values below
# are generic placeholders so the repository itself remains public-safe.
#
# Enabled capabilities are deliberately limited to the shared release scope:
# responsive browsing (explorer + folder/content/tag pages), local full-text
# search, and Obsidian/Tolaria-compatible wikilinks. Graph views, backlinks,
# comments, analytics, RSS/sitemap output, editing, and other digital-garden
# features are excluded (tag pages are now in scope; see
# docs/adr-0001-knowledge-web-publisher.md).
configuration:
  pageTitle: Knowledge Web
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: localhost
  ignorePatterns:
    - ".DS_Store"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  # Parses YAML frontmatter into page data and resolves wikilinks inside
  # frontmatter (e.g. Tolaria relationships). The visual properties panel is
  # hidden: only the processing behavior is needed.
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: true
      hidePropertiesView: true
      delimiters: ---
    order: 5
  - source: ./plugins/knowledge-vault
    enabled: true
    order: 10
    layout:
      position: left
      priority: 15
  # Wikilinks (Obsidian/Tolaria-compatible) must be transformed before link
  # resolution, so this stays ahead of crawl-links.
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 80
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/search
    enabled: true
    options:
      fieldPriority: ["title", "tags", "content"]
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  # Emits the local search index consumed by the search component. Sitemap
  # and RSS output stay disabled: they are outside the shared release scope.
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: false
      enableRSS: false
    order: 90
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    collection:
      exclude:
        - article-title
